# Unit tests (Karma/Jasmine) and E2E (Playwright) for acervo-web.
# Kept separate from dotnet.yml so .NET defaults.working-directory does not apply.
name: Frontend

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/acervo-web

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/acervo-web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Unit tests
        run: npm run test:ci

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/acervo-web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/acervo-web
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        working-directory: frontend/acervo-web
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        working-directory: frontend/acervo-web
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/acervo-web/playwright-report
          retention-days: 7

      - name: Stop stack
        if: always()
        run: docker compose down
