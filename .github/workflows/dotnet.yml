# Build and test the Acervo backend.
# Solution lives in a subdirectory and uses the .slnx format (not repo-root .sln).
name: .NET

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

defaults:
  run:
    working-directory: backend/Acervo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: backend/Acervo/global.json

    - name: Restore dependencies
      run: dotnet restore Acervo.slnx

    - name: Build
      run: dotnet build Acervo.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test Acervo.slnx --no-build --configuration Release --verbosity normal
