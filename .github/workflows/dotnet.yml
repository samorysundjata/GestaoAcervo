# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: ./backend/Acervo/global.json
    - name: Restore dependencies
      working-directory: ./backend/Acervo
      run: dotnet restore Acervo.slnx
    - name: Build
      working-directory: ./backend/Acervo
      run: dotnet build Acervo.slnx --no-restore
    - name: Test
      working-directory: ./backend/Acervo
      run: dotnet test Acervo.slnx --no-build --verbosity normal
