server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # gzip for text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # -------------------------------------------------------------------------
    # HTML5 Angular routing — all unknown paths fall through to index.html
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Long-lived cache ONLY for assets that carry a content hash in the filename.
    #
    # Angular emits lazy chunks as "chunk-ABCDEFGH.js" and (when outputHashing is
    # enabled) entry points as "main-ABCDEFGH.js" / "styles-ABCDEFGH.css". The
    # hash segment makes the URL content-addressable, so `immutable` is safe:
    # a new build produces a new filename, and the browser fetches it anyway.
    # This block must appear BEFORE the generic no-cache block below so nginx's
    # "first-match wins" rule picks the more specific pattern.
    # -------------------------------------------------------------------------
    location ~* "-[A-Z0-9]{6,}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # -------------------------------------------------------------------------
    # Everything else that is static-asset-shaped (unhashed entry points like
    # styles.css / main.js / polyfills.js, favicons, fonts, images) MUST
    # revalidate on every request.
    #
    # History: a previous version of this file applied `immutable` 1y to every
    # *.js / *.css. Because Angular's current production build emits the entry
    # points WITHOUT a content hash (styles.css, main.js, polyfills.js), the
    # browser treated them as immutable and never re-fetched them after theme
    # swaps — leaving stale Material prebuilt themes active long after the
    # container had been rebuilt. `no-cache` sends the browser an ETag-based
    # conditional GET every load: negligible bandwidth cost, zero stale-theme
    # risk.
    # -------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "no-cache";
    }

    # index.html must never be cached — it is the entry-point manifest that
    # references all hashed (and unhashed) asset URLs.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
